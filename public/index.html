<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ニュース要約リーダー</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="shell">
    <header><span class="eyebrow">NEWS READER</span><h1>ニュースを、耳から。</h1><p>キーワードを入れると、ニュースを探して要約します。</p></header>
    <form id="reader-form">
      <label for="query">調べたいこと</label>
      <div class="search-row"><input id="query" name="query" required maxlength="200" placeholder="例：生成AIの最新ニュース"><button id="submit" type="submit">要約して読む <span aria-hidden="true">→</span></button></div>
      <label class="toggle"><input id="speak" type="checkbox" checked><span>VOICEVOX ずんだもんで読み上げる</span></label>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="result" hidden>
      <div class="result-heading"><span class="eyebrow">SUMMARY</span><button id="replay" class="secondary" type="button" hidden>もう一度聞く</button></div>
      <article id="summary"></article>
      <h2>参照したニュース</h2><ul id="articles"></ul>
    </section>
    <footer>要約には OpenAI API、読み上げには起動中の VOICEVOX Engine を使います。</footer>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
