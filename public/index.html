<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>要約読み上げ</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="shell">
    <header><span class="eyebrow">VOICE READER</span><h1>要約を、耳から。</h1><p>ChatGPTで作った要約を貼り付けて、ずんだもんの声で読み上げます。</p></header>
    <form id="reader-form">
      <label for="summary-input">ChatGPTで作成した要約</label>
      <textarea id="summary-input" name="summary" required maxlength="20000" rows="10" placeholder="ChatGPTの要約をここに貼り付けてください"></textarea>
      <button id="submit" type="submit">ずんだもんで読み上げる <span aria-hidden="true">→</span></button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="result" hidden>
      <div class="result-heading"><span class="eyebrow">VOICEVOX</span></div>
      <audio id="player" controls></audio>
    </section>
    <footer>このアプリはAI要約をしません。ChatGPTの要約と起動中のVOICEVOX Engineを使います。</footer>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
